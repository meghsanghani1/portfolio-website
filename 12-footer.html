      const script = document.currentScript;
      const root = script && script.closest("[data-pm-final-section]");
      if (!root || root.pmDestroy) return;

      const scene = root.querySelector("[data-pm-scene]");
      const playable = root.querySelector("[data-pm-playable]");
      const playfield = root.querySelector("[data-pm-playfield]");
      const jumpButton = root.querySelector("[data-pm-jump]");
      const headlineA = root.querySelector("[data-pm-headline-a]");
      const headlineB = root.querySelector("[data-pm-headline-b]");
      const pills = Array.from(root.querySelectorAll(".pm-pill"));
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const mobileLayout = window.matchMedia("(max-width: 720px)");

      let destroyed = false;
      let started = false;
      let visible = false;
      let sectionProgress = 0;
      let targetProgress = 0;
      let engine = null;
      let masterRafId = 0;
      let lastMasterFrame = 0;
      let resizeObserver = null;
      let revealTimers = [];
      let boundaries = [];
      let entries = [];
      let dragging = null;
      let MatterApi = null;
      let lastFieldWidth = 0;

      const pillToEntry = new Map();
      const spawnPositions = [0.08, 0.54, 0.28, 0.76, 0.43, 0.9, 0.16, 0.66, 0.35, 0.84, 0.22, 0.59];
      const spawnAngles = [-7, 4, 10, -5, 7, -11, 3, 9, -4, 6, -9, 2];

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const smoothstep = (start, end, value) => {
        const x = clamp((value - start) / (end - start), 0, 1);
        return x * x * (3 - 2 * x);
      };

      function setStaticFallback() {
        if (destroyed) return;
        root.classList.add("pm-no-physics");
        pills.forEach((pill) => pill.classList.add("is-live"));
      }

      function measureTargetProgress() {
        if (destroyed || reducedMotion.matches) return;
        const rect = root.getBoundingClientRect();
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
        const travel = Math.max(1, root.offsetHeight - viewportHeight);
        targetProgress = clamp(-rect.top / travel, 0, 1);

        if (mobileLayout.matches) {
          const playableRect = playable.getBoundingClientRect();
          if (playableRect.top < viewportHeight * 0.7 && playableRect.bottom > 0) startPhysics();
        }
        requestMasterFrame();
      }

      function applyVisualProgress(progress) {
        const reveal = smoothstep(0.08, 0.5, progress);
        const whiteExit = smoothstep(0.06, 0.28, progress);
        const headlineGroup = smoothstep(0.32, 0.48, progress);
        const headlineFirst = smoothstep(0.32, 0.52, progress);
        const headlineSecond = smoothstep(0.4, 0.6, progress);
        const footerEntry = smoothstep(0.56, 0.74, progress);

        root.style.setProperty("--pm-dark-y", `${(1 - reveal) * 100}%`);
        root.style.setProperty("--pm-white-opacity", String(1 - whiteExit));
        root.style.setProperty("--pm-white-lift", `${-70 * whiteExit}px`);
        root.style.setProperty("--pm-white-scale", String(1 - 0.035 * whiteExit));
        root.style.setProperty("--pm-dark-title-opacity", String(headlineGroup));
        root.style.setProperty("--pm-footer-opacity", String(footerEntry));

        const setHeadlineFrame = (element, amount, x, y) => {
          if (!element) return;
          element.style.opacity = String(amount);
          element.style.clipPath = `inset(0 ${(1 - amount) * 100}% 0 0)`;
          element.style.transform = `translate3d(${(1 - amount) * x}px, ${(1 - amount) * y}px, 0)`;
          element.style.filter = `blur(${(1 - amount) * 6}px)`;
        };

        setHeadlineFrame(headlineA, headlineFirst, -38, 8);
        setHeadlineFrame(headlineB, headlineSecond, -24, 14);

        if (progress >= 0.41) startPhysics();
      }

      function requestMasterFrame() {
        if (masterRafId || destroyed || !visible) return;
        masterRafId = requestAnimationFrame(masterFrame);
      }

      function loadMatter() {
        if (window.Matter) return Promise.resolve(window.Matter);

        const promiseKey = "__meghPerformanceMatterPromise";
        if (window[promiseKey]) return window[promiseKey];

        window[promiseKey] = new Promise((resolve, reject) => {
          const dependency = document.createElement("script");
          dependency.src = "https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js";
          dependency.async = true;
          dependency.crossOrigin = "anonymous";
          dependency.onload = () => window.Matter ? resolve(window.Matter) : reject(new Error("Matter.js unavailable"));
          dependency.onerror = () => reject(new Error("Matter.js failed to load"));
          document.head.appendChild(dependency);
        }).catch((error) => {
          delete window[promiseKey];
          throw error;
        });

        return window[promiseKey];
      }

      function stagePoint(event) {
        const rect = playfield.getBoundingClientRect();
        return {
          x: clamp(event.clientX - rect.left, -80, rect.width + 80),
          y: clamp(event.clientY - rect.top, -140, rect.height + 60)
        };
      }

      function createBoundaries() {
        if (!engine || !MatterApi) return;
        const { Bodies, Composite } = MatterApi;
        const rect = playfield.getBoundingClientRect();
        const thickness = 100;

        if (boundaries.length) Composite.remove(engine.world, boundaries);

        boundaries = [
          Bodies.rectangle(-thickness / 2, rect.height / 2, thickness, rect.height * 2, { isStatic: true }),
          Bodies.rectangle(rect.width + thickness / 2, rect.height / 2, thickness, rect.height * 2, { isStatic: true }),
          Bodies.rectangle(rect.width / 2, rect.height + thickness / 2, rect.width + thickness * 2, thickness, { isStatic: true })
        ];
        Composite.add(engine.world, boundaries);
      }

      function createPillBody(pill, index) {
        if (!engine || !MatterApi || destroyed) return;
        const { Bodies, Composite } = MatterApi;
        const fieldRect = playfield.getBoundingClientRect();
        const width = pill.offsetWidth;
        const height = pill.offsetHeight;
        const availableWidth = Math.max(0, fieldRect.width - width - 24);
        const compact = fieldRect.width <= 720;
        let x = width / 2 + 12 + availableWidth * spawnPositions[index % spawnPositions.length];
        let y = -height * (0.65 + (index % 4) * 0.28);
        let velocity = {
          x: ((index % 3) - 1) * 0.55,
          y: 0
        };

        if (compact) {
          const columnCount = fieldRect.width < 340 ? 1 : 2;
          const columnWidth = fieldRect.width / columnCount;
          const column = index % columnCount;
          const row = Math.floor(index / columnCount);
          const jitterX = (Math.random() - 0.5) * (columnWidth * 0.36);
          x = columnWidth * column + columnWidth / 2 + jitterX;
          y = -height * (0.6 + row * 0.85) - Math.random() * height * 0.4;
          velocity = {
            x: (Math.random() - 0.5) * 1.1,
            y: 1.2 + Math.random() * 0.6
          };
        } else if (index === 3 || index === 9) {
          x = width * 0.24;
          y = fieldRect.height * (index === 3 ? 0.3 : 0.48);
          velocity = { x: 3.4, y: -0.7 };
        } else if (index === 6 || index === 11) {
          x = fieldRect.width - width * 0.24;
          y = fieldRect.height * (index === 6 ? 0.24 : 0.42);
          velocity = { x: -3.4, y: -0.55 };
        }

        const body = Bodies.rectangle(x, y, width, height, {
          chamfer: { radius: height / 2 },
          restitution: 0.32,
          friction: 0.3,
          frictionStatic: 0.42,
          frictionAir: 0.017 + (index % 3) * 0.002,
          density: 0.00165,
          angle: (compact
            ? (Math.random() - 0.5) * 26
            : spawnAngles[index % spawnAngles.length]) * Math.PI / 180
        });

        MatterApi.Body.setVelocity(body, velocity);

        const entry = { pill, body, width, height, index };
        entries.push(entry);
        pillToEntry.set(pill, entry);
        pill.classList.add("is-live");
        Composite.add(engine.world, body);
      }

      function render() {
        entries.forEach(({ pill, body, width, height }) => {
          const x = body.position.x - width / 2;
          const y = body.position.y - height / 2;
          pill.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${body.angle}rad)`;
        });
      }

      function masterFrame(time) {
        masterRafId = 0;
        if (destroyed || !visible) return;

        if (!lastMasterFrame) lastMasterFrame = time;
        const delta = clamp(time - lastMasterFrame, 8, 32);
        lastMasterFrame = time;

        let reversing = false;
        if (mobileLayout.matches) {
          sectionProgress = targetProgress;
        } else {
          reversing = targetProgress < sectionProgress - 0.0005;
          const smoothing = 1 - Math.exp(-delta * 0.0115);
          sectionProgress += (targetProgress - sectionProgress) * smoothing;
          if (Math.abs(targetProgress - sectionProgress) < 0.00015) sectionProgress = targetProgress;
          applyVisualProgress(sectionProgress);
        }

        if (engine && MatterApi && (mobileLayout.matches || (sectionProgress >= 0.39 && !reversing))) {
          MatterApi.Engine.update(engine, delta);
          render();
        }

        masterRafId = requestAnimationFrame(masterFrame);
      }

      function releaseDrag(event) {
        if (!dragging || !MatterApi) return;
        if (event && event.pointerId !== undefined && event.pointerId !== dragging.pointerId) return;

        const { Body, Composite } = MatterApi;
        const { entry, constraint, velocity, time, pointerId } = dragging;
        const recentVelocity = performance.now() - time < 90 ? velocity : { x: 0, y: 0 };
        const currentVelocity = entry.body.velocity;

        Composite.remove(engine.world, constraint);
        Body.setVelocity(entry.body, {
          x: clamp(currentVelocity.x + recentVelocity.x * 0.42, -26, 26),
          y: clamp(currentVelocity.y + recentVelocity.y * 0.42, -28, 28)
        });
        entry.pill.classList.remove("is-dragging");

        if (entry.pill.hasPointerCapture && entry.pill.hasPointerCapture(pointerId)) {
          entry.pill.releasePointerCapture(pointerId);
        }
        dragging = null;
      }

      function onPointerDown(event) {
        const pill = event.target.closest(".pm-pill");
        if (!pill || !playfield.contains(pill) || !MatterApi) return;
        const entry = pillToEntry.get(pill);
        if (!entry) return;

        event.preventDefault();
        releaseDrag();
        if (document.activeElement && playfield.contains(document.activeElement)) {
          document.activeElement.blur();
        }

        const point = stagePoint(event);
        const localGrabPoint = MatterApi.Vector.rotate(
          MatterApi.Vector.sub(point, entry.body.position),
          -entry.body.angle
        );
        const constraint = MatterApi.Constraint.create({
          pointA: { x: point.x, y: point.y },
          bodyB: entry.body,
          pointB: localGrabPoint,
          stiffness: 0.17,
          damping: 0.13,
          length: 0
        });

        MatterApi.Sleeping.set(entry.body, false);
        MatterApi.Composite.add(engine.world, constraint);

        dragging = {
          entry,
          constraint,
          point,
          time: performance.now(),
          velocity: { x: 0, y: 0 },
          pointerId: event.pointerId
        };

        pill.classList.add("is-dragging");
        if (pill.setPointerCapture) pill.setPointerCapture(event.pointerId);
      }

      function onPointerMove(event) {
        if (!dragging || !MatterApi) return;
        event.preventDefault();

        const point = stagePoint(event);
        const now = performance.now();
        const elapsed = Math.max(8, now - dragging.time);
        const frameScale = 16.667 / elapsed;

        dragging.velocity = {
          x: (point.x - dragging.point.x) * frameScale,
          y: (point.y - dragging.point.y) * frameScale
        };
        dragging.point = point;
        dragging.time = now;
        dragging.constraint.pointA.x = point.x;
        dragging.constraint.pointA.y = point.y;
      }

      function onKeyDown(event) {
        const pill = event.target.closest(".pm-pill");
        if (!pill || !MatterApi) return;
        const entry = pillToEntry.get(pill);
        if (!entry) return;

        const impulses = {
          ArrowLeft: { x: -0.022, y: 0 },
          ArrowRight: { x: 0.022, y: 0 },
          ArrowUp: { x: 0, y: -0.035 },
          ArrowDown: { x: 0, y: 0.022 }
        };

        if (impulses[event.key]) {
          event.preventDefault();
          MatterApi.Body.applyForce(entry.body, entry.body.position, impulses[event.key]);
        } else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          MatterApi.Body.setVelocity(entry.body, { x: (Math.random() - 0.5) * 8, y: -13 });
          MatterApi.Body.setAngularVelocity(entry.body, (Math.random() - 0.5) * 0.2);
        }
      }

      function onResize() {
        if (!engine || !MatterApi || destroyed) return;
        const { Body } = MatterApi;
        const fieldRect = playfield.getBoundingClientRect();
        const compact = fieldRect.width <= 720;
        const previousWidth = lastFieldWidth || fieldRect.width;
        const majorWidthChange = entries.length > 0 && Math.abs(fieldRect.width - previousWidth) / Math.max(previousWidth, 1) > 0.16;
        lastFieldWidth = fieldRect.width;
        engine.gravity.y = compact ? 1.22 : 0.74;

        if (majorWidthChange) releaseDrag();
        createBoundaries();

        entries.forEach((entry) => {
          const nextWidth = entry.pill.offsetWidth;
          const nextHeight = entry.pill.offsetHeight;
          const scaleX = nextWidth / entry.width;
          const scaleY = nextHeight / entry.height;

          if (Number.isFinite(scaleX) && Number.isFinite(scaleY) && (Math.abs(scaleX - 1) > 0.01 || Math.abs(scaleY - 1) > 0.01)) {
            Body.scale(entry.body, scaleX, scaleY);
            entry.width = nextWidth;
            entry.height = nextHeight;
          }

          if (majorWidthChange) {
            if (compact) {
              const columnCount = fieldRect.width < 340 ? 1 : 2;
              const columnWidth = fieldRect.width / columnCount;
              const column = entry.index % columnCount;
              const row = Math.floor(entry.index / columnCount);
              const jitterX = (Math.random() - 0.5) * (columnWidth * 0.36);
              Body.setPosition(entry.body, {
                x: columnWidth * column + columnWidth / 2 + jitterX,
                y: -entry.height * (0.6 + row * 0.85) - Math.random() * entry.height * 0.4
              });
              Body.setVelocity(entry.body, {
                x: (Math.random() - 0.5) * 1.1,
                y: 1.2 + Math.random() * 0.6
              });
            } else {
              const availableWidth = Math.max(0, fieldRect.width - entry.width - 16);
              Body.setPosition(entry.body, {
                x: entry.width / 2 + 8 + availableWidth * spawnPositions[entry.index % spawnPositions.length],
                y: -entry.height * (0.8 + (entry.index % 5) * 0.72)
              });
              Body.setVelocity(entry.body, {
                x: ((entry.index % 3) - 1) * 0.45,
                y: 0
              });
            }
            Body.setAngularVelocity(entry.body, 0);
          } else {
            Body.setPosition(entry.body, {
              x: clamp(entry.body.position.x, entry.width / 2, fieldRect.width - entry.width / 2),
              y: clamp(entry.body.position.y, -entry.height * 4, fieldRect.height - entry.height / 2)
            });
          }
        });
        render();
        measureTargetProgress();
      }

      function initPhysics(Matter) {
        if (destroyed) return;
        MatterApi = Matter;
        const compact = playfield.getBoundingClientRect().width <= 720;
        engine = Matter.Engine.create({
          enableSleeping: true,
          gravity: { x: 0, y: compact ? 1.22 : 0.74, scale: 0.001 }
        });
        engine.positionIterations = 9;
        engine.velocityIterations = 7;
        engine.constraintIterations = 5;

        createBoundaries();
        lastFieldWidth = playfield.getBoundingClientRect().width;

        pills.forEach((pill, index) => {
          const timer = window.setTimeout(() => createPillBody(pill, index), (compact ? 78 : 165) * index);
          revealTimers.push(timer);
        });

        playfield.addEventListener("pointerdown", onPointerDown);
        playfield.addEventListener("pointermove", onPointerMove, { passive: false });
        playfield.addEventListener("keydown", onKeyDown);
        document.addEventListener("pointerup", releaseDrag);
        document.addEventListener("pointercancel", releaseDrag);

        resizeObserver = new ResizeObserver(onResize);
        resizeObserver.observe(playfield);
        requestMasterFrame();
      }

      function startPhysics() {
        if (started || destroyed) return;
        started = true;

        if (reducedMotion.matches) {
          setStaticFallback();
          return;
        }

        loadMatter().then(initPhysics).catch(setStaticFallback);
      }

      function onJumpClick() {
        if (mobileLayout.matches || reducedMotion.matches) {
          playable.scrollIntoView({
            block: "start",
            behavior: reducedMotion.matches ? "auto" : "smooth"
          });
          return;
        }

        const rect = root.getBoundingClientRect();
        const rootTop = window.scrollY + rect.top;
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
        const travel = Math.max(0, root.offsetHeight - viewportHeight);
        window.scrollTo({
          top: rootTop + travel * 0.62,
          behavior: reducedMotion.matches ? "auto" : "smooth"
        });
      }

      const visibilityObserver = new IntersectionObserver((records) => {
        const record = records[0];
        visible = Boolean(record && record.isIntersecting);
        if (visible) {
          lastMasterFrame = 0;
          measureTargetProgress();
          requestMasterFrame();
        } else {
          cancelAnimationFrame(masterRafId);
          masterRafId = 0;
        }
      }, { threshold: 0.01 });

      visibilityObserver.observe(root);

      if (reducedMotion.matches) {
        root.classList.add("pm-reduced");
        setStaticFallback();
      } else {
        window.addEventListener("scroll", measureTargetProgress, { passive: true });
        window.addEventListener("resize", measureTargetProgress, { passive: true });
        measureTargetProgress();
      }
      jumpButton.addEventListener("click", onJumpClick);

      root.pmDestroy = () => {
        if (destroyed) return;
        destroyed = true;
        visibilityObserver.disconnect();
        if (resizeObserver) resizeObserver.disconnect();
        cancelAnimationFrame(masterRafId);
        revealTimers.forEach((timer) => clearTimeout(timer));
        releaseDrag();

        window.removeEventListener("scroll", measureTargetProgress);
        window.removeEventListener("resize", measureTargetProgress);
        jumpButton.removeEventListener("click", onJumpClick);

        playfield.removeEventListener("pointerdown", onPointerDown);
        playfield.removeEventListener("pointermove", onPointerMove);
        playfield.removeEventListener("keydown", onKeyDown);
        document.removeEventListener("pointerup", releaseDrag);
        document.removeEventListener("pointercancel", releaseDrag);

        if (engine && MatterApi) {
          MatterApi.Composite.clear(engine.world, false, true);
          MatterApi.Engine.clear(engine);
        }

        pills.forEach((pill) => {
          pill.classList.remove("is-live", "is-dragging");
          pill.style.removeProperty("transform");
        });

        [headlineA, headlineB].forEach((line) => {
          if (!line) return;
          line.style.removeProperty("opacity");
          line.style.removeProperty("clip-path");
          line.style.removeProperty("transform");
          line.style.removeProperty("filter");
        });

        [
          "--pm-dark-y",
          "--pm-white-opacity",
          "--pm-white-lift",
          "--pm-white-scale",
          "--pm-dark-title-opacity",
          "--pm-footer-opacity"
        ].forEach((property) => root.style.removeProperty(property));

        root.classList.remove("pm-no-physics", "pm-reduced");
        root.pmDestroy = null;
      };
    })();
  </script>
</section>
