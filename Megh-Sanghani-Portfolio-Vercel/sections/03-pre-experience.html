<!--
  Insert-ready portfolio section.
  This fragment intentionally avoids global html/body styles and scroll control.
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&display=swap");

  .o2cd-discipline,
  .o2cd-discipline * {
    box-sizing: border-box;
  }

  .o2cd-discipline {
    --o2cd-red: #ff2b20;
    --o2cd-ink: #090909;
    --o2cd-paper: #f2efe5;
    position: relative;
    isolation: isolate;
    width: 100%;
    overflow: clip;
    background: var(--o2cd-ink);
    color: var(--o2cd-paper);
    font-family: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }

  .o2cd-discipline .o2cd-intro,
  .o2cd-discipline .o2cd-stage {
    position: relative;
    width: 100%;
  }

  .o2cd-discipline .o2cd-intro {
    display: grid;
    min-height: 100vh;
    min-height: 100svh;
    place-items: center;
    overflow: hidden;
    padding: clamp(1rem, 3vw, 3rem);
    background: var(--o2cd-ink);
  }

  .o2cd-discipline .o2cd-intro-title {
    width: 50%;
    margin: 0;
    color: var(--o2cd-red);
    font-size: 5rem;
    font-stretch: condensed;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 0.85;
    text-align: center;
    text-transform: uppercase;
  }

  .o2cd-discipline .o2cd-intro-line {
    display: block;
    white-space: nowrap;
  }

  .o2cd-discipline .o2cd-stage {
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }

  .o2cd-discipline .o2cd-stage--final {
    height: 100vh;
    height: 100svh;
  }

  .o2cd-discipline .o2cd-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    contain: paint;
  }

  .o2cd-discipline .o2cd-frame--red {
    background: var(--o2cd-red);
    color: var(--o2cd-paper);
  }

  .o2cd-discipline .o2cd-frame--paper {
    background: var(--o2cd-paper);
    color: var(--o2cd-ink);
  }

  .o2cd-discipline .o2cd-word {
    display: block;
    position: relative;
    left: -0.035em;
    z-index: 2;
    width: max-content;
    margin: 0 auto;
    font-size: var(--o2cd-word-size);
    font-stretch: condensed;
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.85;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
    transform: scaleY(0);
    transform-origin: 50% 0%;
    will-change: transform;
  }

  .o2cd-discipline .o2cd-stage--foundation {
    --o2cd-word-size: 23vw;
  }

  .o2cd-discipline .o2cd-stage--foundation .o2cd-word {
    font-weight: 300;
  }

  .o2cd-discipline .o2cd-stage--expansion {
    --o2cd-word-size: 35vw;
  }

  .o2cd-discipline .o2cd-stage--final {
    --o2cd-word-size: 27vw;
  }

  .o2cd-discipline .o2cd-photo,
  .o2cd-discipline .o2cd-final-plate {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .o2cd-discipline .o2cd-photo {
    z-index: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 52% 34%, rgba(255, 43, 32, 0.58), transparent 24%),
      linear-gradient(125deg, #141414 0%, #3e0d0b 52%, #070707 100%);
  }

  .o2cd-discipline .o2cd-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .o2cd-discipline .o2cd-final-plate {
    z-index: 1;
    overflow: hidden;
    background-color: var(--o2cd-ink);
    color: var(--o2cd-red);
    transform: scale3d(1, 1, 1);
    transform-origin: 50% 50%;
    will-change: opacity, transform, background-color;
  }

  @media (max-width: 1000px) {
    .o2cd-discipline .o2cd-intro-title {
      width: calc(100% - 2rem);
      font-size: 3rem;
    }
  }

  @media (max-width: 700px) {
    .o2cd-discipline .o2cd-intro {
      padding: 1rem;
    }

    .o2cd-discipline .o2cd-intro-title {
      width: 100%;
      font-size: clamp(2.25rem, 11.5vw, 3rem);
    }

    .o2cd-discipline .o2cd-word {
      left: -0.02em;
    }

    .o2cd-discipline .o2cd-photo img {
      object-position: 50% 50%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .o2cd-discipline .o2cd-stage,
    .o2cd-discipline .o2cd-stage--final {
      height: 100vh;
      height: 100svh;
    }

    .o2cd-discipline .o2cd-frame {
      position: relative;
    }

    .o2cd-discipline .o2cd-word,
    .o2cd-discipline .o2cd-final-plate,
    .o2cd-discipline .o2cd-photo img {
      transform: none !important;
    }
  }
</style>

<section class="o2cd-discipline" data-o2cd-discipline aria-label="Three chapters of an evolving discipline">
  <div class="o2cd-intro">
    <h2 class="o2cd-intro-title">
      <span class="o2cd-intro-line">Three chapters.</span>
      <span class="o2cd-intro-line">One evolving</span>
      <span class="o2cd-intro-line">discipline.</span>
    </h2>
  </div>

  <div class="o2cd-stage o2cd-stage--foundation" data-o2cd-standard-stage>
    <div class="o2cd-frame o2cd-frame--paper">
      <h3 class="o2cd-word">Foundation</h3>
    </div>
  </div>

  <div class="o2cd-stage o2cd-stage--expansion" data-o2cd-standard-stage>
    <div class="o2cd-frame o2cd-frame--red">
      <h3 class="o2cd-word">Expansion</h3>
    </div>
  </div>

  <div class="o2cd-stage o2cd-stage--final" data-o2cd-final-stage>
    <div class="o2cd-frame">
      <div class="o2cd-photo" aria-hidden="true">
        <img src="https://motionprompts.dev/c/phive-text-scroll-animation/img.jpg" alt="" loading="lazy" decoding="async">
      </div>
      <div class="o2cd-final-plate">
        <h3 class="o2cd-word">Evolved</h3>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
  (() => {
    const script = document.currentScript;
    let root = script && script.previousElementSibling;

    while (root && !root.matches("[data-o2cd-discipline]")) {
      root = root.previousElementSibling;
    }

    if (!root || !root.matches("[data-o2cd-discipline]")) return;
    if (!window.gsap || !window.ScrollTrigger) return;

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const standardStages = [...root.querySelectorAll("[data-o2cd-standard-stage]")];
    const finalStage = root.querySelector("[data-o2cd-final-stage]");
    const finalPlate = finalStage.querySelector(".o2cd-final-plate");
    const finalWord = finalPlate.querySelector(".o2cd-word");
    const ink = getComputedStyle(root).getPropertyValue("--o2cd-ink").trim() || "#090909";
    const inkRgb = hexToRgb(ink);
    const scales = new Map();

    root.o2cdCleanup?.();
    window.gsap.registerPlugin(window.ScrollTrigger);

    function clamp(value, min = 0, max = 1) {
      return Math.min(max, Math.max(min, value));
    }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      const full = value.length === 3
        ? value.split("").map((character) => character + character).join("")
        : value;
      const number = Number.parseInt(full, 16);
      return {
        r: (number >> 16) & 255,
        g: (number >> 8) & 255,
        b: number & 255
      };
    }

    function measure() {
      root.querySelectorAll(".o2cd-word").forEach((word) => {
        const frame = word.closest(".o2cd-frame");
        word.style.fontSize = "";

        const naturalFontSize = Number.parseFloat(getComputedStyle(word).fontSize);
        const naturalWidth = word.scrollWidth;
        const horizontalInset = frame.clientWidth <= 700 ? 0.9 : 0.94;
        const availableWidth = frame.clientWidth * horizontalInset;

        if (naturalWidth > availableWidth) {
          const fittedFontSize = naturalFontSize * (availableWidth / naturalWidth);
          word.style.fontSize = `${fittedFontSize}px`;
        }

        scales.set(word, frame.clientHeight / Math.max(word.offsetHeight, 1));
      });
    }

    measure();

    const context = window.gsap.context(() => {
      if (reducedMotion.matches) {
        root.querySelectorAll(".o2cd-word").forEach((word) => {
          word.style.transform = "scaleY(1)";
        });
        return;
      }

      standardStages.forEach((stage) => {
        const word = stage.querySelector(".o2cd-word");

        window.ScrollTrigger.create({
          trigger: stage,
          start: "top bottom",
          end: "top top",
          scrub: 1,
          onUpdate: (self) => {
            word.style.transform = `scaleY(${(scales.get(word) || 1) * self.progress})`;
          }
        });

        window.ScrollTrigger.create({
          trigger: stage,
          start: "top top",
          end: () => `+=${stage.offsetHeight}px`,
          pin: true,
          pinSpacing: false,
          scrub: 1,
          onUpdate: (self) => {
            word.style.transform = `scaleY(${(scales.get(word) || 1) * (1 - self.progress)})`;
          }
        });
      });

      window.ScrollTrigger.create({
        trigger: finalStage,
        start: "top bottom",
        end: "top top",
        scrub: 1,
        onUpdate: (self) => {
          finalWord.style.transform = `scaleY(${(scales.get(finalWord) || 1) * self.progress})`;
        }
      });

      window.ScrollTrigger.create({
        trigger: finalStage,
        start: "top top",
        end: () => `+=${finalStage.offsetHeight * 4}px`,
        pin: true,
        pinSpacing: true,
        scrub: 1,
        onUpdate: (self) => {
          const progress = self.progress;
          const zoomProgress = clamp(progress / 0.75);
          const zoom = 1 + 9 * zoomProgress;
          const backdropAlpha = 1 - clamp((progress - 0.25) / 0.25);
          const textOpacity = 1 - clamp((progress - 0.5) / 0.25);

          finalPlate.style.transform = `scale3d(${zoom}, ${zoom}, 1)`;
          finalPlate.style.backgroundColor = `rgba(${inkRgb.r}, ${inkRgb.g}, ${inkRgb.b}, ${backdropAlpha})`;
          finalPlate.style.opacity = String(textOpacity);
        }
      });
    }, root);

    const refresh = () => {
      measure();
      window.ScrollTrigger.refresh();
    };

    const handleRefreshInit = () => measure();
    window.ScrollTrigger.addEventListener("refreshInit", handleRefreshInit);

    root.o2cdCleanup = () => {
      window.ScrollTrigger.removeEventListener("refreshInit", handleRefreshInit);
      context.revert();
      delete root.o2cdCleanup;
    };

    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('300 100px "Roboto Condensed"'),
        document.fonts.load('900 100px "Roboto Condensed"')
      ]).then(refresh);
    }

    window.ScrollTrigger.refresh();
  })();
</script>
