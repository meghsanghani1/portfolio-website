<script>
  (() => {
    "use strict";

    const clamp = (value, min, max) => Math.max(min, Math.min(value, max));
    const lerp = (start, end, amount) => start + (end - start) * amount;

    const transforms = [
      [[10, 50, -10, 10], [20, -10, -45, 20]],
      [[0, 47.5, -10, 15], [-25, 15, -45, 30]],
      [[0, 52.5, -10, 5], [15, -5, -40, 60]],
      [[0, 50, 30, -80], [20, -10, 60, 5]],
      [[0, 55, -15, 30], [25, -15, 60, 95]]
    ];

    document.querySelectorAll("[data-pm-swarm]").forEach((root) => {
      if (root.dataset.pmSwarmReady === "true") return;
      root.dataset.pmSwarmReady = "true";

      const headlineTrack = root.querySelector(".pm-swarm__headline-track");
      const cards = Array.from(root.querySelectorAll(".pm-swarm__card"));
      const progressLine = root.querySelector(".pm-swarm__progress-line");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let frameRequested = false;
      let sectionIsNear = true;

      const syncViewportWidth = () => {
        const viewportWidth = document.documentElement.clientWidth;
        root.style.setProperty("--pm-viewport-width", `${viewportWidth}px`);
        root.style.setProperty("--pm-half-viewport-width", `${viewportWidth / 2}px`);
      };

      syncViewportWidth();

      const render = () => {
        frameRequested = false;
        if (!sectionIsNear || reducedMotion.matches) return;

        const rect = root.getBoundingClientRect();
        const runway = Math.max(1, rect.height - window.innerHeight);
        const progress = clamp(-rect.top / runway, 0, 1);
        const maxTranslate = Math.max(0, headlineTrack.scrollWidth - root.clientWidth);
        const isCompact = root.clientWidth <= 900;
        const yScale = isCompact ? 0.68 : 0.86;
        const rotationScale = isCompact ? 0.5 : 0.8;

        headlineTrack.style.transform = `translate3d(${-progress * maxTranslate}px, 0, 0)`;
        progressLine.style.setProperty("--pm-progress", progress.toFixed(4));

        cards.forEach((card, index) => {
          const delay = index * (isCompact ? 0.155 : 0.1125);
          const duration = isCompact ? 0.38 : 0.5;
          const cardProgress = clamp((progress - delay) / duration, 0, 1);

          if (cardProgress <= 0) {
            card.style.opacity = "0";
            return;
          }

          const yPositions = transforms[index][0];
          const rotations = transforms[index][1];
          const trackProgress = cardProgress * 3;
          const segment = Math.min(Math.floor(trackProgress), 2);
          const segmentProgress = trackProgress - segment;
          const yPercent = lerp(yPositions[segment], yPositions[segment + 1], segmentProgress) * yScale;
          const rotation = lerp(rotations[segment], rotations[segment + 1], segmentProgress) * rotationScale;
          const startX = card.offsetWidth * 0.25;
          const exitDistance = isCompact ? 1.78 : 1.15;
          const endX = -(root.clientWidth + card.offsetWidth * exitDistance);
          const xPixels = lerp(startX, endX, cardProgress);
          const yPixels = card.offsetHeight * yPercent / 100;
          const exitOpacity = cardProgress > 0.94
            ? clamp((1 - cardProgress) / 0.06, 0, 1)
            : 1;

          card.style.opacity = exitOpacity.toFixed(3);
          card.style.transform = `translate3d(${xPixels}px, ${yPixels}px, 0) rotate(${rotation}deg)`;
        });
      };

      const requestRender = () => {
        if (frameRequested) return;
        frameRequested = true;
        window.requestAnimationFrame(render);
      };

      const handleResize = () => {
        syncViewportWidth();
        requestRender();
      };

      const observer = new IntersectionObserver(
        (entries) => {
          sectionIsNear = entries[0].isIntersecting;
          if (sectionIsNear) requestRender();
        },
        { rootMargin: "100% 0px 100% 0px" }
      );

      observer.observe(root);
      window.addEventListener("scroll", requestRender, { passive: true });
      window.addEventListener("resize", handleResize, { passive: true });
      reducedMotion.addEventListener?.("change", requestRender);
      requestRender();
    });
  })();
</script>
